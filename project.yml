name: ReceiptScanner
options:
  bundleIdPrefix: dev.cosmichomeless
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ReceiptKit:
    path: .
targets:
  ReceiptScanner:
    type: application
    platform: iOS
    sources:
      - ReceiptScanner
    dependencies:
      - package: ReceiptKit
    info:
      path: ReceiptScanner/Info.plist
      properties:
        CFBundleDisplayName: Receipt Scanner
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Receipt Scanner uses the camera to scan paper receipts. Images are processed on your device and never uploaded.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cosmichomeless.ReceiptScanner
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  ReceiptScannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ReceiptScannerUITests
    dependencies:
      - target: ReceiptScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.cosmichomeless.ReceiptScannerUITests
        TEST_TARGET_NAME: ReceiptScanner
