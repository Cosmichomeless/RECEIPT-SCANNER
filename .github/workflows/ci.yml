name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Tests that do not depend on the machine's text-recognition hardware. Required.
      # `--build-system swiftbuild` compiles the .xcstrings catalogs into .lproj like Xcode does; the default
      # build system only copies them, which makes every localized string fall back to English.
      - name: Swift tests
        timeout-minutes: 15
        run: |
          swift test --build-system swiftbuild \
            --skip recognizesRenderedText \
            --skip blankImageReportsNoTextFound \
            --skip EndToEndFlowTests \
            --skip downscalingKeepsTheTotalReadable

      # Real Vision OCR. GitHub's macOS runners are virtual machines without a Neural Engine or GPU, where Vision can
      # stall for many minutes. These stay authoritative on a Mac (`swift test`) and on a device; here they are
      # informational so a stalled recognizer cannot block the pipeline.
      - name: Swift tests with real Vision OCR (informational)
        continue-on-error: true
        timeout-minutes: 10
        run: swift test --build-system swiftbuild --filter 'recognizesRenderedText|blankImageReportsNoTextFound|EndToEndFlowTests'

      - name: Project is in sync with project.yml
        run: |
          brew install xcodegen
          xcodegen generate
          git diff --exit-code ReceiptScanner.xcodeproj

      - name: Build the app
        timeout-minutes: 20
        run: |
          xcodebuild -project ReceiptScanner.xcodeproj -scheme ReceiptScanner \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
